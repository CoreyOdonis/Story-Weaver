openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: stories
    description: Story generation and storage operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /generate-story:
    post:
      operationId: generateStory
      tags: [stories]
      summary: Generate a bedtime story
      description: Generates a personalized bedtime story based on child's name, age, and interests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateStoryRequest"
      responses:
        "200":
          description: Story generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateStoryResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /saved-stories:
    get:
      operationId: getSavedStories
      tags: [stories]
      summary: Get all saved stories
      description: Returns all saved stories ordered by newest first
      responses:
        "200":
          description: List of saved stories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedStory"
    post:
      operationId: saveStory
      tags: [stories]
      summary: Save a story
      description: Saves a generated story to the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveStoryRequest"
      responses:
        "201":
          description: Story saved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedStory"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /saved-stories/{id}:
    delete:
      operationId: deleteSavedStory
      tags: [stories]
      summary: Delete a saved story
      description: Deletes a saved story by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Story deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Story not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenerateStoryRequest:
      type: object
      properties:
        childName:
          type: string
          description: The child's name
        age:
          type: integer
          minimum: 1
          maximum: 12
          description: The child's age
        interests:
          type: array
          items:
            type: string
            enum: [dinosaurs, space, princess, animals, cars, magic]
          description: The child's interests
      required:
        - childName
        - age
        - interests
    GenerateStoryResponse:
      type: object
      properties:
        title:
          type: string
          description: The story title
        story:
          type: string
          description: The full story text
        emoji:
          type: string
          description: A fun emoji that represents the story
      required:
        - title
        - story
        - emoji
    SaveStoryRequest:
      type: object
      properties:
        childName:
          type: string
        emoji:
          type: string
        title:
          type: string
        story:
          type: string
        interests:
          type: string
          description: Comma-separated interests
      required:
        - childName
        - emoji
        - title
        - story
        - interests
    SavedStory:
      type: object
      properties:
        id:
          type: integer
        childName:
          type: string
        emoji:
          type: string
        title:
          type: string
        story:
          type: string
        interests:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - childName
        - emoji
        - title
        - story
        - interests
        - createdAt
    DeleteResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
