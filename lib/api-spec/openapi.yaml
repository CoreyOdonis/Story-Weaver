openapi: 3.0.3
info:
  title: Dreamtime Stories API
  version: 1.0.0
paths:
  /generate-story:
    post:
      summary: Generate a bedtime story
      description: Generates a personalized bedtime story based on child's name, age, interests, and requested length
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateStoryRequest'
      responses:
        '200':
          description: Story generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateStoryResponse'
components:
  schemas:
    GenerateStoryRequest:
      type: object
      properties:
        childName:
          type: string
          description: The child's name
        age:
          type: integer
          minimum: 1
          maximum: 12
          description: The child's age
        interests:
          type: array
          items:
            type: string
            enum: [dinosaurs, space, princess, animals, cars, magic]
          description: The child's interests
        length:
          type: string
          enum: ["5min", "10min", "15min"]
          default: "5min"
          description: Requested story length
      required:
        - childName
        - age
        - interests
    GenerateStoryResponse:
      type: object
      properties:
        title:
          type: string
        story:
          type: string
        emoji:
          type: string
      required:
        - title
        - story
        - emoji
